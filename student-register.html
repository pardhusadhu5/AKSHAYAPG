<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Admission Registration | Akshaya Deluxe Boys Hostel</title>
  <meta name="description" content="Complete your admission registration for Akshaya Deluxe Boys Hostel. Enter your details to submit your application.">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px 24px;
      background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 50%, var(--primary-ultra-light) 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-container {
      width: 100%;
      max-width: 540px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-left: 8px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .auth-actions-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-actions-footer a {
      color: var(--primary-brand);
      font-weight: 600;
      transition: var(--transition-fast);
    }
    .auth-actions-footer a:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    @media (max-width: 576px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .auth-section {
        padding-top: 80px;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header scrolled" style="position: fixed; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm);">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i data-lucide="home"></i></div>
        Akshaya<span>Deluxe</span>
      </a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="index.html#rooms" class="nav-link">Rooms</a>
        <a href="index.html#facilities" class="nav-link">Facilities</a>
        <a href="index.html#food" class="nav-link">Food Menu</a>
        <a href="index.html#gallery" class="nav-link">Gallery</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem;">Back to Home</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Area -->
  <section class="auth-section">
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    
    <div class="container auth-container">
      <div class="auth-card glass-card">
        <div class="auth-header">
          <h2>Admission Registration</h2>
          <p>Fill out your details to submit your hostel admission application</p>
        </div>
        
        <form id="studentRegisterForm" enctype="multipart/form-data">
          <!-- Hidden Verified Token -->
          <input type="hidden" id="regVerificationToken">

          <!-- Profile Photo Upload -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label class="form-label" for="regPhoto">Profile Photo (Optional)</label>
            <input type="file" id="regPhoto" class="form-input" accept="image/*" style="padding: 10px;">
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regName">Full Name *</label>
              <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regPhone">
                Mobile Number *
                <span class="verified-badge">Verified ✓</span>
              </label>
              <input type="tel" id="regPhone" class="form-input" readonly style="background: rgba(0,0,0,0.04); font-weight: 700; cursor: not-allowed;">
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regAadhaar">Aadhaar Number *</label>
              <input type="text" id="regAadhaar" class="form-input" placeholder="e.g. 543210987654" required pattern="[0-9]{12}" maxlength="12">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regCollege">College Name *</label>
              <input type="text" id="regCollege" class="form-input" placeholder="e.g. Aurora Engineering College" required>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regBranch">Academic Branch / Course</label>
              <input type="text" id="regBranch" class="form-input" placeholder="e.g. B.Tech CSE / AI & ML">
            </div>

            <div class="form-group">
              <label class="form-label" for="regRoll">College Roll / Hall Ticket No.</label>
              <input type="text" id="regRoll" class="form-input" placeholder="e.g. 22AUR0501">
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regYear">Year of Study *</label>
              <select id="regYear" class="form-input">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year" selected>3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regParentName">Parent / Guardian Name *</label>
              <input type="text" id="regParentName" class="form-input" placeholder="e.g. Suresh Sharma" required>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regGuardianRel">Guardian Relationship</label>
              <select id="regGuardianRel" class="form-input">
                <option value="Father">Father</option>
                <option value="Mother">Mother</option>
                <option value="Guardian" selected>Guardian</option>
                <option value="Relative">Relative</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="regParentPhone">Parent Mobile Number *</label>
              <input type="tel" id="regParentPhone" class="form-input" placeholder="e.g. 9000123457" required pattern="[0-9]{10}">
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regPreferredRoom">Preferred Room Type *</label>
              <select id="regPreferredRoom" class="form-input" required>
                <option value="2 Sharing">2 Sharing</option>
                <option value="3 Sharing" selected>3 Sharing</option>
                <option value="4 Sharing">4 Sharing</option>
                <option value="5 Sharing">5 Sharing</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="regDuration">Stay Duration (Months)</label>
              <select id="regDuration" class="form-input">
                <option value="6">6 Months</option>
                <option value="12" selected>12 Months</option>
                <option value="24">24 Months</option>
              </select>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regCity">City</label>
              <input type="text" id="regCity" class="form-input" placeholder="e.g. Hyderabad">
            </div>

            <div class="form-group">
              <label class="form-label" for="regState">State</label>
              <input type="text" id="regState" class="form-input" placeholder="e.g. Telangana">
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regEmail">Email Address (Optional)</label>
              <input type="email" id="regEmail" class="form-input" placeholder="e.g. rahul@mail.com">
            </div>

            <div class="form-group">
              <label class="form-label" for="regEmergency">Emergency Contact</label>
              <input type="tel" id="regEmergency" class="form-input" placeholder="e.g. 9848011223">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submitAppBtn" style="width: 100%; margin-top: 16px; padding: 14px; font-size: 1rem;">Submit Admission Application</button>
        </form>
        
        <div class="auth-actions-footer">
          <p>Already verified or signed in? <a href="student-login.html">Login via Phone OTP</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding: 40px 0 20px 0;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; flex-direction: column; text-align: center; gap: 12px;">
      <p>Copyright &copy; 2026 Akshaya Deluxe Boys Hostel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    (function() {
      const originalFetch = window.fetch;
      const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:8080' : '';
      window.fetch = function(input, init) {
        if (typeof input === 'string' && input.startsWith('/api/')) {
          input = API_BASE + input;
        }
        return originalFetch(input, init);
      };
    })();

    // On Load: Ensure OTP verification was completed
    window.addEventListener('DOMContentLoaded', () => {
      const verificationToken = sessionStorage.getItem('verificationToken');
      const verifiedPhone = sessionStorage.getItem('verifiedPhone');

      if (!verificationToken || !verifiedPhone) {
        alert('Please verify your mobile number using OTP first.');
        window.location.href = 'student-login.html';
        return;
      }

      document.getElementById('regVerificationToken').value = verificationToken;
      document.getElementById('regPhone').value = verifiedPhone;
    });

    const form = document.getElementById('studentRegisterForm');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const verificationToken = document.getElementById('regVerificationToken').value;
        const phone = document.getElementById('regPhone').value;
        const name = document.getElementById('regName').value.trim();
        const aadhaarNumber = document.getElementById('regAadhaar').value.trim();
        const collegeName = document.getElementById('regCollege').value.trim();
        const branch = document.getElementById('regBranch').value.trim();
        const rollNumber = document.getElementById('regRoll').value.trim();
        const year = document.getElementById('regYear').value;
        const parentName = document.getElementById('regParentName').value.trim();
        const guardianRelationship = document.getElementById('regGuardianRel').value;
        const parentPhone = document.getElementById('regParentPhone').value.trim();
        const preferredRoomType = document.getElementById('regPreferredRoom').value;
        const stayDuration = document.getElementById('regDuration').value;
        const city = document.getElementById('regCity').value.trim();
        const state = document.getElementById('regState').value.trim();
        const emergencyContact = document.getElementById('regEmergency').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const photoFile = document.getElementById('regPhoto').files[0];

        const submitBtn = document.getElementById('submitAppBtn');
        const originalText = submitBtn.innerText;

        const formData = new FormData();
        formData.append('verificationToken', verificationToken);
        formData.append('phone', phone);
        formData.append('name', name);
        formData.append('aadhaarNumber', aadhaarNumber);
        formData.append('collegeName', collegeName);
        formData.append('branch', branch);
        formData.append('rollNumber', rollNumber);
        formData.append('year', year);
        formData.append('parentName', parentName);
        formData.append('guardianRelationship', guardianRelationship);
        formData.append('parentPhone', parentPhone);
        formData.append('preferredRoomType', preferredRoomType);
        formData.append('stayDuration', stayDuration);
        formData.append('city', city);
        formData.append('state', state);
        formData.append('emergencyContact', emergencyContact);
        formData.append('email', email);
        if (photoFile) formData.append('photo', photoFile);

        try {
          submitBtn.disabled = true;
          submitBtn.innerText = 'Submitting Application...';

          const response = await fetch('/api/auth/register-with-otp', {
            method: 'POST',
            body: formData
          });

          let data;
          try {
            data = await response.json();
          } catch (_) {
            throw new Error('Unable to connect to server. Please try again.');
          }

          if (response.ok && data.success) {
            sessionStorage.removeItem('verificationToken');
            sessionStorage.removeItem('verifiedPhone');

            if (data.token) {
              localStorage.setItem('token', data.token);
              localStorage.setItem('user', JSON.stringify(data.user));
            }

            alert(`Admission application submitted successfully!\n\nYour Application ID: ${data.applicationId}\n\nYour application is now under admin review.`);
            window.location.href = 'student/dashboard.html';
          } else {
            alert(data.message || 'Registration failed. Please try again.');
          }
        } catch (err) {
          console.error('Registration Error:', err);
          alert(err.message || 'Connection error. Please try again.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      });
    }
  </script>
</body>
</html>
