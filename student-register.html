<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Registration | Dolphin PG Hostel</title>
  <meta name="description" content="Register to Dolphin PG Hostel and book a room. Enter your details to get started.">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px 24px;
      background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 50%, var(--primary-ultra-light) 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-container {
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-actions-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-actions-footer a {
      color: var(--primary-brand);
      font-weight: 600;
      transition: var(--transition-fast);
    }
    .auth-actions-footer a:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 576px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .auth-section {
        padding-top: 80px;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header scrolled" style="position: fixed; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm);">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i data-lucide="anchor"></i></div>
        Dolphin<span>PG</span>
      </a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="index.html#rooms" class="nav-link">Rooms</a>
        <a href="index.html#facilities" class="nav-link">Facilities</a>
        <a href="index.html#food" class="nav-link">Food Menu</a>
        <a href="index.html#gallery" class="nav-link">Gallery</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem;">Back to Home</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Area -->
  <section class="auth-section">
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    
    <div class="container auth-container">
      <div class="auth-card glass-card">
        <div class="auth-header">
          <h2>Registration</h2>
          <p>Create an account to join Dolphin PG Hostel</p>
        </div>
        
        <form id="studentRegisterForm">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regName">Full Name</label>
              <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regEmail">Email Address</label>
              <input type="email" id="regEmail" class="form-input" placeholder="e.g. rahul@mail.com" required>
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regPhone">Phone Number</label>
              <input type="tel" id="regPhone" class="form-input" placeholder="e.g. +91 8142638659" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regCollege">College or Company Name</label>
              <input type="text" id="regCollege" class="form-input" placeholder="e.g. RV College of Engineering" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="regRoom">Preferred Room Sharing</label>
            <select id="regRoom" class="form-input">
              <option value="single">Single Sharing (₹15,000/mo)</option>
              <option value="double" selected>Double Sharing (₹10,500/mo)</option>
              <option value="triple">Triple Sharing (₹8,500/mo)</option>
              <option value="four">Four Sharing (₹7,000/mo)</option>
            </select>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regPass">Password</label>
              <input type="password" id="regPass" class="form-input" placeholder="••••••••" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regPassConfirm">Confirm Password</label>
              <input type="password" id="regPassConfirm" class="form-input" placeholder="••••••••" required>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Create Account & Book Visit</button>
        </form>
        
        <div class="auth-actions-footer">
          <p>Already have an account? <a href="student-login.html">Login Here</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding: 40px 0 20px 0;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; flex-direction: column; text-align: center; gap: 12px;">
      <p>Copyright &copy; 2026 Dolphin PG Hostel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Handle Registration Submit Simulation
    const form = document.getElementById('studentRegisterForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = document.getElementById('regPass').value;
        const p2 = document.getElementById('regPassConfirm').value;
        
        if (p1 !== p2) {
          alert("Error: Passwords do not match!");
          return;
        }
        
        alert("Success! Account created successfully. Redirecting to login portal...");
        window.location.href = "student-login.html";
      });
    }
  </script>
</body>
</html>
