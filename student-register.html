<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Registration | Akshaya Deluxe Boys Hostel</title>
  <meta name="description" content="Register to Akshaya Deluxe Boys Hostel and book a room. Enter your details to get started.">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px 24px;
      background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 50%, var(--primary-ultra-light) 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-container {
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-actions-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-actions-footer a {
      color: var(--primary-brand);
      font-weight: 600;
      transition: var(--transition-fast);
    }
    .auth-actions-footer a:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 576px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .auth-section {
        padding-top: 80px;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header scrolled" style="position: fixed; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm);">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i data-lucide="home"></i></div>
        Akshaya<span>Deluxe</span>
      </a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="index.html#rooms" class="nav-link">Rooms</a>
        <a href="index.html#facilities" class="nav-link">Facilities</a>
        <a href="index.html#food" class="nav-link">Food Menu</a>
        <a href="index.html#gallery" class="nav-link">Gallery</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem;">Back to Home</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Area -->
  <section class="auth-section">
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    
    <div class="container auth-container">
      <div class="auth-card glass-card">
        <div class="auth-header">
          <h2>Registration</h2>
          <p>Create an account to join Akshaya Deluxe Boys Hostel</p>
        </div>
        
        <form id="studentRegisterForm" enctype="multipart/form-data">
          <!-- Profile Photo Upload -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label class="form-label" for="regPhoto">Profile Photo</label>
            <input type="file" id="regPhoto" class="form-input" accept="image/*" required style="padding: 10px;">
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regName">Full Name</label>
              <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regPhone">Mobile Number</label>
              <input type="tel" id="regPhone" class="form-input" placeholder="e.g. 9848022338" required pattern="[0-9]{10,15}">
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regAadhaar">Aadhaar Number</label>
              <input type="text" id="regAadhaar" class="form-input" placeholder="e.g. 543210987654" required pattern="[0-9]{12}">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regCollege">College Name</label>
              <input type="text" id="regCollege" class="form-input" placeholder="e.g. Aurora College" required>
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regYear">Year of Study</label>
              <select id="regYear" class="form-input">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year" selected>3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regParentName">Parent Name</label>
              <input type="text" id="regParentName" class="form-input" placeholder="e.g. Suresh Sharma" required>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regParentPhone">Parent Mobile Number</label>
              <input type="tel" id="regParentPhone" class="form-input" placeholder="e.g. 9000123457" required pattern="[0-9]{10,15}">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regEmail">Email Address (Optional)</label>
              <input type="email" id="regEmail" class="form-input" placeholder="e.g. rahul@mail.com">
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="regPass">Password</label>
              <input type="password" id="regPass" class="form-input" placeholder="••••••••" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="regPassConfirm">Confirm Password</label>
              <input type="password" id="regPassConfirm" class="form-input" placeholder="••••••••" required>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Register & Create Account</button>
        </form>
        
        <div class="auth-actions-footer">
          <p>Already have an account? <a href="student-login.html">Login Here</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding: 40px 0 20px 0;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; flex-direction: column; text-align: center; gap: 12px;">
      <p>Copyright &copy; 2026 Akshaya Deluxe Boys Hostel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    (function() {
      const originalFetch = window.fetch;
      const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:8080' : '';
      window.fetch = function(input, init) {
        if (typeof input === 'string' && input.startsWith('/api/')) {
          input = API_BASE + input;
        }
        return originalFetch(input, init);
      };
    })();

    const form = document.getElementById('studentRegisterForm');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        const aadhaarNumber = document.getElementById('regAadhaar').value;
        const collegeName = document.getElementById('regCollege').value;
        const year = document.getElementById('regYear').value;
        const parentName = document.getElementById('regParentName').value;
        const parentPhone = document.getElementById('regParentPhone').value;
        const email = document.getElementById('regEmail').value;
        const p1 = document.getElementById('regPass').value;
        const p2 = document.getElementById('regPassConfirm').value;
        const photoFile = document.getElementById('regPhoto').files[0];
        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerText;
        
        if (p1 !== p2) {
          alert("Passwords do not match.");
          return;
        }

        const formData = new FormData();
        formData.append('photo', photoFile);
        formData.append('name', name);
        formData.append('phone', phone);
        formData.append('aadhaarNumber', aadhaarNumber);
        formData.append('collegeName', collegeName);
        formData.append('year', year);
        formData.append('parentName', parentName);
        formData.append('parentPhone', parentPhone);
        formData.append('email', email);
        formData.append('password', p1);
        formData.append('confirmPassword', p2);

        try {
          submitBtn.disabled = true;
          submitBtn.innerText = 'Creating Account...';

          const response = await fetch('/api/auth/register', {
            method: 'POST',
            body: formData
          });

          const data = await response.json();

          if (data.success) {
            alert("Registration completed successfully.");
            window.location.href = 'student-login.html';
          } else {
            alert(data.message || 'Registration failed.');
          }
        } catch (err) {
          console.error('Error:', err);
          alert('Connection Error: ' + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      });
    }
  </script>
</body>
</html>
