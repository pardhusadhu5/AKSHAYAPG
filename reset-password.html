<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password | Akshaya Deluxe Boys Hostel</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px 24px;
      background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 50%, var(--primary-ultra-light) 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-actions-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-actions-footer a {
      color: var(--primary-brand);
      font-weight: 600;
      transition: var(--transition-fast);
      text-decoration: none;
    }
    .auth-actions-footer a:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    @media (max-width: 767px) {
      .auth-section {
        padding-top: 80px;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header scrolled" style="position: fixed; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm);">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i data-lucide="home"></i></div>
        Akshaya<span>Deluxe</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem;">Back to Home</a>
      </div>
    </div>
  </header>

  <!-- Main Section -->
  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-card glass-card">
        <div class="auth-header" id="headerText">
          <h2>New Password</h2>
          <p>Please enter your new account password</p>
        </div>
        
        <form id="resetForm">
          <div class="form-group" style="margin-bottom: 20px;">
            <label class="form-label" for="resetPass">New Password</label>
            <input type="password" id="resetPass" class="form-input" placeholder="••••••••" required>
          </div>
          
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="resetPassConfirm">Confirm Password</label>
            <input type="password" id="resetPassConfirm" class="form-input" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
        </form>
        
        <div class="auth-actions-footer">
          <p>Back to <a href="student-login.html">Login Portal</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding: 40px 0 20px 0;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; flex-direction: column; text-align: center; gap: 12px;">
      <p>Copyright &copy; 2026 Akshaya Deluxe Boys Hostel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    (function() {
      const originalFetch = window.fetch;
      const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:8080' : '';
      window.fetch = function(input, init) {
        if (typeof input === 'string' && input.startsWith('/api/')) {
          input = API_BASE + input;
        }
        return originalFetch(input, init);
      };
    })();

    if (typeof lucide !== 'undefined') lucide.createIcons();

    // Parse token from URL query params
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('resetForm');
    const headerText = document.getElementById('headerText');

    if (!token) {
      alert('Error: Missing password reset token.');
      form.style.display = 'none';
      headerText.querySelector('p').innerText = 'Invalid token. Please request a new link.';
      headerText.querySelector('p').style.color = 'var(--error)';
    }

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('resetPass').value;
        const p2 = document.getElementById('resetPassConfirm').value;
        const submitBtn = form.querySelector('button[type="submit"]');

        if (p1 !== p2) {
          alert('Error: Passwords do not match!');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.innerText = 'Updating...';

          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: p1 })
          });

          const data = await response.json();

          if (data.success) {
            alert('Password updated successfully! Redirecting to login...');
            window.location.href = 'student-login.html';
          } else {
            alert(data.message || 'Reset failed.');
          }
        } catch (err) {
          console.error(err);
          alert('Connection Error: ' + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Update Password';
        }
      });
    }
  </script>
</body>
</html>
