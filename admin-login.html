<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login | Dolphin PG Hostel</title>
  <meta name="description" content="Access the Dolphin PG Hostel administrative console. Manage admissions, track occupancy, verify payments, and handle support requests.">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px 24px;
      background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 50%, var(--primary-ultra-light) 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-actions-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-actions-footer a {
      color: var(--primary-brand);
      font-weight: 600;
      transition: var(--transition-fast);
    }
    .auth-actions-footer a:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    @media (max-width: 767px) {
      .auth-section {
        padding-top: 80px;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header scrolled" style="position: fixed; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm);">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i data-lucide="anchor"></i></div>
        Dolphin<span>PG</span>
      </a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="index.html#rooms" class="nav-link">Rooms</a>
        <a href="index.html#facilities" class="nav-link">Facilities</a>
        <a href="index.html#food" class="nav-link">Food Menu</a>
        <a href="index.html#gallery" class="nav-link">Gallery</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem;">Back to Home</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Area -->
  <section class="auth-section">
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    
    <div class="container auth-container">
      <div class="auth-card glass-card">
        <div class="auth-header">
          <h2>Admin Console</h2>
          <p>Sign in to manage Dolphin PG admissions & staff</p>
        </div>
        
        <form id="adminLoginForm">
          <div class="form-group">
            <label class="form-label" for="adminEmail">Admin Email ID</label>
            <input type="email" id="adminEmail" class="form-input" placeholder="e.g. admin@dolphinpghostel.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="adminSecret">Secret Security Key</label>
            <input type="password" id="adminSecret" class="form-input" placeholder="Enter key code" required>
          </div>
          
          <div class="form-group" style="margin-bottom: 30px;">
            <label class="form-label" for="adminPass">Password</label>
            <input type="password" id="adminPass" class="form-input" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%;">Access Admin Dashboard</button>
        </form>
        
        <div class="auth-actions-footer">
          <p><a href="student-login.html">Login to Student Portal Instead</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding: 40px 0 20px 0;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; flex-direction: column; text-align: center; gap: 12px;">
      <p>Copyright &copy; 2026 Dolphin PG Hostel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Handle Admin Login Simulation
    const form = document.getElementById('adminLoginForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alert("Success! Accessing Admin Dashboard Console...");
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
